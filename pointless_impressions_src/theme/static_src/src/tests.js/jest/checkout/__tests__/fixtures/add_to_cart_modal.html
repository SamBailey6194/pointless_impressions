<!-- Add to Cart Modal Fixture - For Jest Testing -->
<!-- Mimics the structure of add_to_cart_modal.html -->

<dialog id="add_to_cart_modal" class="modal">
  <div class="modal-box w-full max-w-md">
    <h3 class="font-bold text-lg mb-4">
      <i class="fa-solid fa-cart-plus mr-2"></i> Add to Cart
    </h3>

    <!-- Product Info Display -->
    <div class="card bg-base-200 mb-6">
      <div class="card-body p-4">
        <div class="flex gap-4">
          <!-- Product Image -->
          <div class="w-20 h-20 shrink-0 bg-base-300 rounded-lg overflow-hidden">
            <img 
              id="modal_artwork_image" 
              src="/test-image.jpg" 
              alt="Test Artwork" 
              class="w-full h-full object-cover"
            />
            <div id="modal_image_placeholder" class="w-full h-full items-center justify-center text-base-content/40 hidden">
              <i class="fa-solid fa-image text-2xl"></i>
            </div>
          </div>

          <!-- Product Details -->
          <div class="flex-1">
            <p class="text-sm text-base-content/70">Adding to cart:</p>
            <p id="modal_artwork_name" class="font-semibold text-base">Test Artwork</p>
            <p id="modal_artwork_price" class="text-primary font-bold text-lg mt-1">£199.99</p>
            <p id="modal_artwork_stock" class="text-sm text-base-content/60 mt-1">5 in stock</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Add to Cart Form -->
    <form id="add_to_cart_form" class="space-y-4">
      <input type="hidden" name="csrfmiddlewaretoken" value="test-csrf-token" />

      <!-- Hidden Artwork ID -->
      <input type="hidden" id="modal_artwork_id" name="artwork_id" value="artwork-1" />

      <!-- Quantity Selection -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Quantity</span>
          <span class="label-text-alt text-base-content/60" id="max_quantity_info">Max: 5</span>
        </label>
        <div class="flex gap-2 items-center">
          <button type="button" class="btn btn-sm btn-outline" id="qty_decrease">
            <i class="fa-solid fa-minus"></i>
          </button>
          <input 
            type="number" 
            id="quantity" 
            name="quantity" 
            value="1" 
            min="1" 
            max="5"
            class="input input-bordered input-sm w-20 text-center" 
            required 
          />
          <button type="button" class="btn btn-sm btn-outline" id="qty_increase">
            <i class="fa-solid fa-plus"></i>
          </button>
          <span id="qty_error" class="text-error text-sm ml-auto hidden"></span>
        </div>
      </div>

      <!-- Framing Options (if applicable) -->
      <div id="framing_section" class="form-control hidden">
        <label class="label">
          <span class="label-text font-semibold">Framing Option</span>
        </label>
        <select 
          id="framing_option" 
          name="framing_option" 
          class="select select-bordered select-sm w-full"
        >
          <option value="" disabled selected>Select framing option...</option>
        </select>
      </div>

      <!-- Cart Notes (Optional) -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Special Requests</span>
          <span class="label-text-alt text-base-content/60">Optional</span>
        </label>
        <textarea 
          id="notes" 
          name="notes" 
          placeholder="e.g., 'Gift wrapping requested'" 
          class="textarea textarea-bordered textarea-sm w-full h-20 resize-none"
          maxlength="500"
        ></textarea>
        <label class="label">
          <span class="label-text-alt text-base-content/60" id="notes_count">0/500</span>
        </label>
      </div>

      <!-- Error Message Display -->
      <div id="form_error" class="alert alert-error gap-2 hidden">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error_message"></span>
      </div>

      <!-- Success Message Display -->
      <div id="form_success" class="alert alert-success gap-2 hidden">
        <i class="fa-solid fa-circle-check"></i>
        <span id="success_message">Added to cart successfully!</span>
      </div>

      <!-- Form Actions -->
      <div class="flex gap-2 justify-end pt-4">
        <button 
          type="button" 
          class="btn btn-ghost" 
          id="cancel_btn"
          onclick="document.getElementById('add_to_cart_modal').close()"
        >
          Cancel
        </button>
        <button 
          type="submit" 
          class="btn btn-primary gap-2"
          id="submit_btn"
        >
          <i class="fa-solid fa-cart-plus"></i>
          Add to Cart
        </button>
      </div>
    </form>
  </div>

  <!-- Modal Backdrop - Close on outside click -->
  <form method="dialog" class="modal-backdrop">
    <button></button>
  </form>
</dialog>
