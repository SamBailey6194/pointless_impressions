{% load static tailwind_tags cloudinary crispy_forms_tags %}

<dialog id="edit-user-info-modal" class="modal">
    <div class="modal-box lg:w-7/12 lg:max-w-4xl lg:h-9/12">
        <form method="post" action="{% url 'dashboard:change_password' %}" class="form-card">
            {% csrf_token %}
            {% crispy edit_user_info_form %}
            <div class="modal-action">
                <button type="submit" class="btn btn-ghost btn-outline">Save</button>
                <button type="button" class="btn btn-ghost js-close-modal-btn" data-modal-id="edit-user-info-modal">
                    <i class="fa-solid fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>

    <form method="dialog" class="modal-backdrop flex items-end justify-end">
        <button>close</button>
    </form>
</dialog>
