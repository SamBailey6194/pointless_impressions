{% load static tailwind_tags cloudinary crispy_forms_tags %}

<dialog id="update-order-modal" class="modal">
    <div class="modal-box lg:w-7/12 lg:max-w-4xl lg:h-9/12">
        <form method="post" class="form-card p-8" id="update-order-form" data-order-id="{{ order_id }}">
            {% csrf_token %}
            {% crispy order_form %}
            <div class="modal-action p-4">
                <button type="submit" class="btn btn-ghost btn-outline">Save</button>
                <button type="button" class="btn btn-ghost js-close-modal-btn" data-modal-id="update-order-modal">
                    <i class="fa-solid fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>

    <form method="dialog" class="modal-backdrop flex items-end justify-end">
        <button>close</button>
    </form>
</dialog>
