services:
  # --------------------
  # Django Web
  # --------------------
  web_staging:
    build:
      context: .
      dockerfile: Dockerfile.staging
    container_name: pointless_impressions_web_staging
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=pointless_impressions_src.pointless_impressions.settings.staging
      - DEBUG=False
    ports:
      - "8001:8000"
    # Note: No volume mounts for staging - we want to use the built image
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: /app/pointless_impressions_src/staging-entrypoint.sh
