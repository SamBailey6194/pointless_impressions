services:
  # --------------------
  # Django Web
  # --------------------
  web_prod:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: pointless_impressions_web_prod
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=pointless_impressions_src.pointless_impressions.settings.production
      - DEBUG=False
    ports:
      - "8002:8000"
    # Note: No volume mounts for production - we want to use the built image
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: /app/pointless_impressions_src/production-entrypoint.sh
